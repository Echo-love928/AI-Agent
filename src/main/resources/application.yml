spring:
  application:
    name: AI-Agent
  profiles:
    active: local
# 本地知识库向量持久化配置
rag:
  vector-store:
    path: data/mind-vector-store.json
    # 强制重建时设为 true，重建完成后改回 false。
    rebuild: false
    # 修改解析或关键词规则时递增，使已有缓存失效。
    cache-version: 1
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ai.aiagent.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
#searchAPI
search-api:
  api-key: ${SEARCH_API_API_KEY:}
